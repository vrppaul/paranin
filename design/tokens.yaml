# The design's tokens. First its colours, each named for what it does, in the light theme (Catppuccin Latte) and
# the dark one (Catppuccin Macchiato), the palettes the first version kept (docs/FOUNDATION.md §3.4). scripts/tokens
# writes them into internal/look, where the TUI reads them, and into web/src/tokens/tokens.css, where the page does:
# `go generate ./internal/look`.
#
# A colour has its value in each theme, and `basic`: the one of a terminal's sixteen colours it falls back to,
# 0 to 15, or `own` where the terminal's own colour serves. A blend is a colour the page lays at a strength over
# its background, or over the colour the blend names `under` it; a terminal has no opacity, so the blend is worked
# out into a colour of its own.
#
# The face, the text styles, the lengths and the times after the colours are the page's alone, since a terminal has
# a face, a size and a grid of its own: each becomes custom properties of tokens.css and nothing of internal/look.
# The face is its families by name, in the order a browser tries them. Every size is in rem, the text size the reader
# set, so the whole page grows with it; none is in pixels. A text style is its size and its line's height, and its
# weight; a line is in rem, not rows, since a style's line need not be a whole row. A length is in rem, a time in whole
# milliseconds. Each comes with the first part of the page that draws by it.

background:
  about: the page itself, which every blend is laid over
  light: "#eff1f5"
  dark: "#24273a"

colours:
  - name: sunk
    about: the panel under the page, the prompt's, the rim it rises into, and a window over the page; a shade below the page
    light: "#e6e9ef"
    dark: "#1e2030"
    basic: own
  - name: deep
    about: the status line under the panel, a shade below it
    light: "#dce0e8"
    dark: "#181926"
    basic: own
  - name: text
    about: what a reader reads
    light: "#4c4f69"
    dark: "#cad3f5"
    basic: own
  - name: muted
    about: what stands beside the text and says less
    light: "#6c6f85"
    dark: "#a5adcb"
    basic: own
  - name: faint
    about: what a reader may pass over, a gap still to fill among it
    light: "#8c8fa1"
    dark: "#8087a2"
    basic: 8
  - name: quiet
    about: a rule between two parts of a bar, or inside a window
    light: "#ccd0da"
    dark: "#363a4f"
    basic: 8
  - name: edge
    about: the border of a window laid over the page, and a role that ended on the career's line
    light: "#9ca0b0"
    dark: "#5b6078"
    basic: 8
  - name: accent
    about: what the eye goes to first, a command among it
    light: "#fe640b"
    dark: "#f5a97f"
    basic: 3
  - name: host
    about: the site's host where it is written, as the prompt's, and the far end of the author's name
    light: "#8839ef"
    dark: "#c6a0f6"
    basic: 5
  - name: label
    about: what names the text after it, as the place in the prompt
    light: "#1e66f5"
    dark: "#8aadf4"
    basic: 4
  - name: prompt
    about: the mark a prompt ends in, after which the reader types
    light: "#40a02b"
    dark: "#a6da95"
    basic: 2
  - name: on_accent
    about: text laid on the accent
    light: "#24273a"
    dark: "#24273a"
    basic: 0
  - name: error
    about: what says something went wrong, as a search that found nothing
    light: "#d20f39"
    dark: "#ed8796"
    basic: 1
  - name: passed
    about: what says a check passed, as the health report's OK
    light: "#40a02b"
    dark: "#a6da95"
    basic: 2
  - name: warned
    about: what says a check passed with something to look at, as the health report's WARNING
    light: "#df8e1d"
    dark: "#eed49f"
    basic: 3
  - name: time_bar
    about: a bar as long as the time a skill was used, drawn to scale on the list of skills
    light: "#1e66f5"
    dark: "#8aadf4"
    basic: 4

blends:
  - name: tint
    about: a result worth seeing first, the accent laid over the page
    over: accent
    light: 0.16
    dark: 0.22
    basic: 3
    # a terminal of 256 colours would round so faint a blend to a grey, so it leans this far to its colour first
    indexed_lean: 0.25
  - name: chosen
    about: the ground of the item chosen in a window, the text laid faintly over the bars
    over: text
    under: sunk
    light: 0.07
    dark: 0.06
    basic: own
    indexed_lean: 0

face:
  about: the one face the page is written in, monospace as a terminal's, then what stands in for it where it is missing
  families: [JetBrains Mono, ui-monospace, SFMono-Regular, menlo, monospace]

type:
  - name: body
    about: the text read, every page's own
    size: 1
    line: 1.5
    weight: 400

lengths:
  - name: focus_width
    about: how wide a focus ring is, and how far it stands from what it rings
    rem: 0.125
  - name: name_cell
    about: a cell of the author's name in block letters at its natural size, which shrinks to its column
    rem: 1
  - name: title_cell
    about: a cell of a title in block letters at its natural size, which shrinks to its column
    rem: 0.75

times:
  - name: blink
    about: one blink of the cursor after the name, shown for half of it, as a terminal's cursor blinks
    milliseconds: 1060
