# The site's own words in English, which every face shows beside the facts: the titles of the résumé's
# sections and of the index's, the greeting before the author's name, the labels of the ways to reach the author
# and of a project's details, the end of what still goes on, how long a skill was used where the profile says
# `side` or `learning`, the title of the TUI's health report, and the page's frame: the name of its theme button,
# which is pressed while the page is dark, a command's button that copies it: the word on it, the word it turns to
# once it has, its name and what the toast says then; the first screen's button that writes to the author, in the
# author's own voice, as the site speaks; what ssh and curl give, which their hints say; the blog's session in the
# foot line, the labels of a post's facts, and a code block's button that copies it: its name and what the toast says
# then; and a post's series and the panes at its foot: a part's place in its series and where it stands for the
# reader, the panes' headings, each side's name and what a side with none says, the word before where the post is
# discussed, and the name of its outline; and the blog's list: the line it opens with, its window, the way to it beside
# a post's other posts, the word before how it groups its posts, its grouping by year, its group of the posts in no
# series, how many posts a group holds, one or more, how many of a series' parts are out, its name in a grouping, and
# the filter of a list filtered by a tag or a series, and that filter as the way back to the whole list; and a post's
# versions, the title of the window that lists them, the words that mark the current one and the one read, and what an
# older one says of the newer; the titles of the blog's feed and of a series'; and the language: the label of a post's
# language, the language's own name for itself, which the language's Switch shows, and the locale Open Graph marks its
# pages in, language_TERRITORY; and the list's grouping by series, after the word before how it groups its posts,
# apart from the series' label among a post's facts, since a language may write the two otherwise. A phrase holds a place, {}, for each
# value it takes, in the order the site hands them: the command, the code block's number on its page, a part's number
# and the count of parts, the series' title, a count of posts, the parts out and the count of parts, the list's title
# and the grouping's word, the tag, the filter's words, the newer version's day, the author's name, the series' title
# and the blog's feed's title. `paranin check content` requires every one of them.

