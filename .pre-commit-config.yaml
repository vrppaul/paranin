# Every hook runs once, before the commit; the two message checks run on the message, and `pre-commit install`
# installs both stages. A hook that cannot run fails: leave one out only on purpose, by naming it in SKIP. The hooks
# read the working tree, so CI (.github/workflows/gates.yml) runs them again on what a commit carries, with the check
# that needs the network; a message, CI never sees. Each repo of hooks runs at the commit its tag named when it was
# pinned, in the form `pre-commit autoupdate --freeze` writes, and each package a hook's environment holds is
# pinned exactly, so a moved tag or a new release runs nothing new
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # The Go gates. The linters are built at a pinned version in an environment pre-commit makes for them, with the
  # Go of this machine, so a linter built with an older Go never refuses the language go.mod names, and nothing
  # of theirs reaches go.mod
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (the linters and the layers)
        entry: golangci-lint run
        language: golang
        additional_dependencies: [github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0]
        files: (\.go|^\.golangci\.yml|^go\.mod|^go\.sum)$
        pass_filenames: false
      # gofumpt over every Go file handed over, tests included, which the linters do not read. It checks and
      # rewrites nothing: a commit never carries formatting it was not shown. A testdata folder holds code as a
      # rule's test needs it written, so formatting leaves it alone, as the go command does
      - id: golangci-fmt
        name: golangci-lint fmt (gofumpt, tests included)
        entry: golangci-lint fmt --diff
        language: golang
        additional_dependencies: [github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0]
        types: [go]
        exclude: /testdata/
      - id: golangci-config
        name: golangci-lint (its configuration)
        entry: golangci-lint config verify
        language: golang
        additional_dependencies: [github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0]
        files: ^\.golangci\.yml$
        pass_filenames: false
      # The rules no linter here can be told to keep (scripts/coderules/main.go)
      - id: code-rules
        name: code rules (names, helpers, records, markup, colours, numbers, proxies, history, comment widths)
        entry: go run ./scripts/coderules ./...
        language: system
        types: [go]
        pass_filenames: false
      # A commit's message: a short subject, a few lines of why, no history (scripts/commitmessage/main.go)
      - id: commit-message
        name: commit message (its subject, its why, no history)
        entry: go run ./scripts/commitmessage
        language: system
        stages: [commit-msg]
      # go.mod says what the code imports, no more and no less
      - id: go-mod-tidy
        name: go.mod as the code needs it
        entry: go mod tidy -diff
        language: system
        files: (\.go|^go\.mod|^go\.sum)$
        pass_filenames: false
      # The design's colours in Go, in CSS, for a canvas and for the cards, the page's faces, text styles and lengths in
      # CSS, its lengths in rem for the cards, and the lengths and the shares of the screen both faces measure by, are
      # the ones design/tokens.yaml makes (scripts/tokens/main.go)
      - id: design-tokens
        name: design tokens (internal/look, the page's tokens.css, times.ts, shares.ts and colours.ts, and the cards' tokens.typ as design/tokens.yaml makes them)
        entry: go run ./scripts/tokens
        language: system
        files: (^design/|^internal/look/|^internal/face/card/tokens\.typ$|^scripts/tokens/|^web/src/tokens/)
        pass_filenames: false
      # Each templ template as templ formats it, and its Go as templ writes it (scripts/templates/main.go)
      - id: templates
        name: templ templates (formatted, their Go written)
        entry: go run ./scripts/templates
        language: system
        files: (\.templ$|_templ\.go$|^scripts/templates/|^go\.mod$)
        pass_filenames: false
      # The content loads as the site would load it; what it warns of, a translation older than its original, refuses
      # nothing, so the hook prints its output when it passes too
      - id: content-check
        name: paranin check (the content)
        entry: go run ./cmd/paranin check content
        language: system
        files: (^content/|\.go$)
        pass_filenames: false
        verbose: true
      # The whole suite takes seconds
      - id: go-test
        name: go test (the tests)
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
      # compose walks a post's parsed tree, which two goroutines may compose at once (release.Derived, ADR-0003), so
      # its tests run under the race detector too. The rest of the suite does not: charm.land/ssh's window, written
      # with no lock, races wish's read of it (TODO.md, Upstream)
      - id: go-test-race
        name: go test -race (compose)
        entry: go test -race ./internal/compose/...
        language: system
        types: [go]
        pass_filenames: false

  # The page's gates, run by pnpm in web/ with the tools its lockfile pins, once `pnpm --dir web install` has put
  # them there. Without pnpm or the install they fail and say so: leave them out on purpose with SKIP
  - repo: local
    hooks:
      # Every stylesheet but the generated tokens, and every component's style, names its colours from the tokens
      # (web/stylelint.config.js)
      - id: page-styles
        name: stylelint (the page's stylesheets and components' styles)
        entry: pnpm --dir web run lint:styles
        language: system
        files: ^web/(src/.*\.(css|svelte)|tests/.*\.svelte|stylelint\.config\.js|package\.json)$
        pass_filenames: false
      # The page's TypeScript and its components as the compiler reads them, strict, and the build's, each its own
      # program (web/tsconfig.json)
      - id: page-types
        name: svelte-check and tsc (the page's types and the build's)
        entry: pnpm --dir web run check:types
        language: system
        files: ^web/(src/|tests/|plugins/|tsconfig(\.\w+)?\.json|svelte\.config\.js|vite\.config\.ts|package\.json)
        pass_filenames: false
      # The layers of src/, the names, the helpers and the lookups, and what a component's markup may not hold
      # (web/eslint.config.js)
      - id: page-scripts
        name: eslint (the page's scripts)
        entry: pnpm --dir web run lint:scripts
        language: system
        files: ^web/
        pass_filenames: false
      # No file, export or tool of the page that nothing uses
      - id: page-unused
        name: knip (what nothing of the page uses)
        entry: pnpm --dir web run check:unused
        language: system
        files: ^web/
        pass_filenames: false
      # The controllers' and the islands' tests, run over the HTML face's golden pages, and the build's plugin's, over
      # the Go fixtures' build, so a change to either runs them
      - id: page-tests
        name: vitest (the page's tests)
        entry: pnpm --dir web run test
        language: system
        files: (^web/(src/|tests/|plugins/|svelte\.config\.js|vite\.config\.ts|package\.json)|^internal/(face/html|assets)/testdata/)
        pass_filenames: false
      # Checks rather than rewrites: a commit never carries formatting it was not shown
      - id: page-format
        name: prettier (the page's files)
        entry: pnpm --dir web run format:check
        language: system
        files: ^web/
        pass_filenames: false

  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # frozen: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # Every hook of the repo installs its package, which needs ruamel.yaml: each names the same pin, so all
      # share one environment
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # a face's licence is kept as its authors released it, a space at a line's end and no end to its last among it
        exclude: &face-licences ^design/fonts/.+/(OFL\.txt|LICENSE\.md)$
        additional_dependencies: &pre-commit-hooks-dependencies [ruamel.yaml==0.19.1]
      - id: end-of-file-fixer
        exclude: *face-licences
        additional_dependencies: *pre-commit-hooks-dependencies
      - id: check-merge-conflict
        additional_dependencies: *pre-commit-hooks-dependencies
      - id: check-yaml
        additional_dependencies: *pre-commit-hooks-dependencies
      - id: check-case-conflict
        additional_dependencies: *pre-commit-hooks-dependencies
      - id: check-symlinks
        additional_dependencies: *pre-commit-hooks-dependencies
      - id: check-added-large-files
        args: [--maxkb=1024]
        additional_dependencies: *pre-commit-hooks-dependencies
      # The SSH face holds a host key on disk: none may reach git
      - id: detect-private-key
        additional_dependencies: *pre-commit-hooks-dependencies

  # claude-review's gate of its instruction files, taken whole (scripts/check_instruction_files.py), run in an
  # environment pre-commit makes for it. A path goes stale when the file it names moves, so it runs on every commit
  - repo: local
    hooks:
      - id: instruction-files
        name: instruction files (their size, the paths they name, how they are reached)
        entry: python scripts/check_instruction_files.py
        language: python
        language_version: python3.14
        additional_dependencies:
          [pydantic==2.14.4, annotated-types==0.8.0, typing-extensions==4.16.0, typing-inspection==0.4.5]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        name: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore]
