# The facts of paran.in, ssh paran.in, the markdown and plain-text copies and cv.pdf, written once. The site
# serves them from this folder; `paranin check content` checks it, as the site will on each load.
#
# A role still held ends `current`. A date not known yet is a gap, as in any text.
#
# A skill's duration is a span, years first and months below twelve (`7y`, `1y 7m`, `11m`); `side`, for a skill used
# on the side; `learning`, for one still being learnt, which says `learning: true` too; or a gap. The site shows
# `side` and `learning` in its own words, from i18n.
#
# Marks in prose and titles; a label, a place, a language, a stack's name, an address, a link's text and a
# command are shown as written:
#   ==text==  a result worth highlighting
#   [text]    a gap still to fill; the site shows it faint
#
# The first four facts brief the reader beside the name on the page's first screen, so the ones a reader should see
# first come first; the rest stand under the summary.

