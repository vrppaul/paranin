# The design's tokens. First its colours, each named for what it does, in the light theme (Catppuccin Latte) and
# the dark one (Catppuccin Macchiato), the palettes the first version kept (docs/FOUNDATION.md §3.4). scripts/tokens
# writes them into internal/look, where the TUI reads them, and into web/src/tokens/tokens.css, where the page does:
# `go generate ./internal/look`.
#
# A colour has its value in each theme, and `basic`: the one of a terminal's sixteen colours it falls back to,
# 0 to 15, or `own` where the terminal's own colour serves; and where it must read, `least_contrast`: the ratio, as
# WCAG 2 works it out, it reads at, at least, over each ground it names, in both themes, which scripts/tokens holds. A
# blend is a colour the page lays at a strength over its background; a terminal has no opacity, so the blend is
# worked out into a colour of its own.
#
# The page's blends, the mixes, the faces, the text styles, the lengths, the times and the layers after the colours are
# the page's alone, since a terminal has a face, a size and a grid of its own: each becomes custom properties of
# tokens.css and nothing of internal/look, but a length in cells marked `terminal`, which a terminal lays out by too,
# and internal/look carries as a number of cells. A share of the screen's height is in whole percent from its top, a
# line a script and a terminal measure by and no stylesheet lays out by: it becomes a constant of internal/look and of
# the page's script, and no custom property.
# A mix is a colour of the file moved a share toward another in each theme, worked out as a blend is, and where it
# must read, its least contrast is held as a colour's. A face is its families by name, in the order a browser tries
# them, and the files of the first, which the site serves: an upright one for each weight a text style drawn in it is
# drawn in, and one for each weight and slant its words are made strong or italic in, each a woff2 under design/, by
# its path from here; the first face is the page's, every text style's unless it names another. Every size is in rem,
# the text size the reader set, so the whole page grows with it; none is in pixels. A text style is its size and its
# line's height, and its weight; a line is in rem, not rows, since a style's line need not be a whole row. A length is
# in rem, or in whole cells of the first face, ch, for a space inside a line, or a share of the size of the text it
# stands in, em; a time is in whole milliseconds; a layer is a height over the page that a part standing over it as it
# scrolls lies on, the layers listed lowest first, each over those before it. Each comes with the first part of the
# page that draws by it.

background:
  about: the page itself, which every blend is laid over
  light: "#eff1f5"
  dark: "#24273a"

colours:
  - name: sunk
    about: the panel under the page, the footer's and the command line's, and a window over the page; a shade below the page
    light: "#e6e9ef"
    dark: "#1e2030"
    basic: own
  - name: deep
    about: a shade below the panel, the ground of the foot line's chips, of a part of it under the pointer and of a quiet control pressed
    light: "#dce0e8"
    dark: "#181926"
    basic: own
  - name: text
    about: what a reader reads
    light: "#4c4f69"
    dark: "#cad3f5"
    basic: own
  - name: muted
    about: what stands beside the text and says less
    # Latte's subtext1, for its least contrast
    light: "#5c5f77"
    dark: "#a5adcb"
    basic: own
    least_contrast: {ratio: 4.7, over: [background, sunk, deep]}
  - name: faint
    about: what a reader may pass over, a gap still to fill among it
    # Latte's subtext0, for its least contrast; never the only ink of something a reader needs
    light: "#6c6f85"
    dark: "#8087a2"
    basic: 8
    least_contrast: {ratio: 3.7, over: [background, sunk, deep]}
  - name: quiet
    about: a rule between two parts of a bar, and the ground of the TUI's menu
    light: "#ccd0da"
    dark: "#363a4f"
    basic: 8
  - name: edge
    about: the border of a window laid over the page, and a role that ended on the career's line
    light: "#9ca0b0"
    dark: "#5b6078"
    basic: 8
  - name: accent
    about: what the eye goes to first, a command among it
    light: "#fe640b"
    dark: "#f5a97f"
    basic: 3
  - name: host
    about: the site's host where it is written, as the footer's session, and the far end of the author's name
    # Latte's mauve darkened along OKLCH lightness, its hue and chroma kept, just enough for its least contrast
    light: "#8230e7"
    dark: "#c6a0f6"
    basic: 5
    # small text, which WCAG asks to read at 4.5:1: the mail's host on the page's ground, the session on the foot line
    # and on its ground under the pointer
    least_contrast: {ratio: 4.5, over: [background, sunk, deep]}
  - name: label
    about: what names the text after it, as a fact's label
    light: "#1e66f5"
    dark: "#8aadf4"
    basic: 4
    # the focus ring, which WCAG asks to stand 3:1 from what is around it
    least_contrast: {ratio: 3, over: [background, sunk, deep]}
  - name: prompt
    about: the mark after which the reader types, on the command line, or a command stands
    light: "#40a02b"
    dark: "#a6da95"
    basic: 2
  - name: on_accent
    about: text laid on the accent
    light: "#24273a"
    dark: "#24273a"
    basic: 0
  - name: error
    about: what says something went wrong, as a search that found nothing
    # Latte's red darkened along OKLCH lightness, its hue and chroma kept, just enough for its least contrast
    light: "#d10e39"
    dark: "#ed8796"
    basic: 1
    # small text, which WCAG asks to read at 4.5:1: the TUI's failed check on the page's ground, a refused command on
    # the command line
    least_contrast: {ratio: 4.5, over: [background, sunk]}
  - name: passed
    about: what says a check passed, as the health report's OK
    light: "#40a02b"
    dark: "#a6da95"
    basic: 2
  - name: warned
    about: what says a check passed with something to look at, as the health report's WARNING
    light: "#df8e1d"
    dark: "#eed49f"
    basic: 3
  - name: time_bar
    about: a bar as long as the time a skill was used, drawn to scale on the list of skills
    light: "#1e66f5"
    dark: "#8aadf4"
    basic: 4
  # The kinds of word in code, each in the hue Catppuccin's own style guide gives it. In Latte each hue is darkened
  # along OKLCH lightness, its hue and chroma kept, just enough to read as small text on sunk, the code block's ground.
  # A comment and punctuation are faint, what a reader may pass over; every other word the text's colour
  - name: code_keyword
    about: a word of the language itself in code, as func and return
    light: "#8738ee"
    dark: "#c6a0f6"
    basic: 5
    least_contrast: {ratio: 4.5, over: [sunk]}
  - name: code_string
    about: text written into code, in its quotes
    light: "#0e7a00"
    dark: "#a6da95"
    basic: 2
    least_contrast: {ratio: 4.5, over: [sunk]}
  - name: code_number
    about: a number in code, or a constant the language names, as true and nil
    # teal, where the guide has peach, the accent, which is never small text
    light: "#00757c"
    dark: "#8bd5ca"
    basic: 6
    least_contrast: {ratio: 4.5, over: [sunk]}
  - name: code_function
    about: a function's name in code, and a key of data, as YAML's
    light: "#155dec"
    dark: "#8aadf4"
    basic: 4
    least_contrast: {ratio: 4.5, over: [sunk]}
  - name: code_type
    about: the name of a type in code, as int and string
    light: "#a15500"
    dark: "#eed49f"
    basic: 3
    least_contrast: {ratio: 4.5, over: [sunk]}
  - name: code_builtin
    about: a function a language comes with, as len
    light: "#d10d38"
    dark: "#ed8796"
    basic: 1
    least_contrast: {ratio: 4.5, over: [sunk]}
  - name: code_operator
    about: a sign in code that works on values, as * and :=
    light: "#006eab"
    dark: "#91d7e3"
    basic: 14
    least_contrast: {ratio: 4.5, over: [sunk]}
  - name: code_variable
    about: a variable a language marks as one, as a shell's $HOME
    light: "#c9253c"
    dark: "#ee99a0"
    basic: 9
    least_contrast: {ratio: 4.5, over: [sunk]}

blends:
  - name: tint
    about: a result worth seeing first, the accent laid over the page
    over: accent
    light: 0.16
    dark: 0.22
    basic: 3
    # a terminal of 256 colours would round so faint a blend to a grey, so it leans this far to its colour first
    indexed_lean: 0.25
  - name: quiet_half
    about: the frame of a pane that leads nowhere, the quiet rule at half its strength, so it reads as off
    over: quiet
    light: 0.5
    dark: 0.5
    basic: 8
    # a grey between two greys, which 256 colours keep as it is
    indexed_lean: 0

page_blends:
  - name: tint_strong
    about: the tint under the pointer, where it is a link, as the way from an older version of a post to the newer
    over: accent
    light: 0.28
    dark: 0.36

mixes:
  - name: title_soft_start
    about: the start of a title set in text, the accent a fifth toward the text, so it reads apart from block letters
    of: accent
    toward: text
    share: 0.2
    # large text, which WCAG asks to read at 3:1
    least_contrast: {ratio: 3, over: [background]}
  - name: title_soft_end
    about: the end of a title set in text, the host's colour a fifth toward the text
    of: host
    toward: text
    share: 0.2
    least_contrast: {ratio: 3, over: [background]}

faces:
  - name: face
    about: the face the page is written in, monospace as a terminal's, then what stands in for it where it is missing
    families: [JetBrains Mono, ui-monospace, SFMono-Regular, menlo, monospace]
    # JetBrains Mono 2.304, its webfonts as JetBrains released them, under the OFL beside them; the ExtraBold, which
    # draws the mail alone, served cut to the characters a mail address holds, by scripts/cut_extrabold.sh
    files:
      - weight: 400
        path: fonts/jetbrains-mono/JetBrainsMono-Regular.woff2
      - weight: 700
        path: fonts/jetbrains-mono/JetBrainsMono-Bold.woff2
      - weight: 800
        path: fonts/jetbrains-mono/JetBrainsMono-ExtraBold-ASCII.woff2
  - name: reading_face
    about: the face an article's words are read in, proportional where it may be, then the page's own face
    families: [iA Writer Duo S, JetBrains Mono, ui-monospace, monospace]
    # iA Writer Duo S, its webfonts as iA released them (iaolo/iA-Fonts at c6588670), under the OFL beside them: upright,
    # bold for words made strong, italic for words stressed
    files:
      - weight: 400
        path: fonts/ia-writer-duo/iAWriterDuoS-Regular.woff2
      - weight: 700
        path: fonts/ia-writer-duo/iAWriterDuoS-Bold.woff2
      - weight: 400
        italic: true
        path: fonts/ia-writer-duo/iAWriterDuoS-Italic.woff2

type:
  - name: body
    about: the text read, every page's own
    size: 1
    line: 1.5
    weight: 400
  - name: strong
    about: what names, as the window shown in the foot line and a regular control's words, and a word made strong
    size: 1
    line: 1.5
    weight: 700
  - name: small
    about: the foot line's words, a field's hint
    size: 0.875
    line: 1.5
    weight: 400
  - name: caption
    about: a word on a compact control, a tooltip's among them; never prose
    size: 0.8125
    line: 1
    weight: 400
  - name: mail
    about: the mail address heading the first screen's brief, the one text in the heaviest weight
    size: 1.5
    line: 2
    weight: 800
  - name: mail_phone
    about: the mail address heading the brief on a phone
    size: 1.25
    line: 2
    weight: 800
  - name: lead
    about: the headline under the author's name
    size: 1.25
    line: 2
    weight: 400
  - name: lead_phone
    about: the headline under the author's name on a phone
    size: 1.0625
    line: 1.625
    weight: 400
  - name: heading
    about: a section's title on a page that is not the résumé
    size: 1.25
    line: 2
    weight: 700
  - name: title_text
    about: a title set in text, a post's, a few words a line
    size: 2.5
    line: 3
    weight: 700
  - name: title_text_mid
    about: a group's title on the blog's list below the wide screen's width, where its column narrows
    size: 2
    line: 2.5
    weight: 700
  - name: title_text_phone
    about: a title set in text on a phone
    size: 1.75
    line: 2.25
    weight: 700
  - name: reading
    about: an article's words, on a line of its own taller than a row, as a proportional face reads best
    face: reading_face
    size: 1.0625
    line: 1.75
    weight: 400
  - name: source
    about: a source beside an article's text, small, on a line short enough to read as one note
    size: 0.8125
    line: 1.25
    weight: 400

lengths:
  - name: focus_width
    about: how wide a focus ring is, and how far it stands from what it rings; twice it, the room under the foot line
    rem: 0.125
  - name: name_cell
    about: a cell of the author's name in block letters at its natural size, which shrinks to its column
    rem: 1
  - name: title_cell
    about: a cell of a title in block letters at its natural size, which shrinks to its column
    rem: 0.75
  - name: cell
    about: a cell of the face, the gap inside a compact control and either side of it
    cells: 1
  - name: cell_2
    about: two cells, either side of a regular control, and between the parts of the foot line
    cells: 2
  - name: cell_3
    about: three cells, between an entry's dates and its words, and a list's indent
    cells: 3
  - name: row
    about: the grid's row, which the text read sits on; how tall the foot line is
    rem: 1.5
  - name: row_2
    about: two rows, how far clear of the foot line a part the keyboard reaches scrolls on a wide screen
    rem: 3
  - name: row_half
    about: half a row, the gap inside a component
    rem: 0.75
  - name: row_3
    about: three rows, between the name's column and the brief's, and under the first screen
    rem: 4.5
  - name: row_4
    about: four rows, above the first screen; how far clear of the foot line a part the keyboard reaches scrolls on a phone
    rem: 6
  - name: brief
    about: how wide the first screen's brief is beside the name
    rem: 27.5
  - name: brief_mid
    about: how wide the brief is below the wide screen's width
    rem: 23.75
  - name: lead
    about: the longest line of the headline under the name
    cells: 40
  - name: post_lead
    about: the longest line of a post's lead under its title, which says more than the headline does
    cells: 52
    terminal: true
  - name: measure
    about: the longest line of prose, a paragraph's or a point's
    cells: 64
  - name: when
    about: an entry's column of dates, wide enough for a range of two months
    cells: 20
  - name: column
    about: the longest line of an article's words, in the reading face
    rem: 43
  - name: aside
    about: how wide the sources beside an article's text stand
    cells: 30
    terminal: true
  - name: rail
    about: how wide a post's Outline stands beside its text, from the wide screen on
    cells: 22
    terminal: true
  - name: group_name
    about: how wide the column of the groups' names stands on the blog's list, a year's or a series' of a few words
    cells: 24
  - name: group_name_mid
    about: how wide the column of the groups' names stands below the wide screen's width
    cells: 18
  - name: tile
    about: the least width of a post's tile on the blog's list, a title of a few words a line
    cells: 30
  - name: title_text_measure
    about: the longest line of a title set in text, a few words, in cells of its own size
    cells: 22
  - name: code_in_words
    about: code among an article's words, a share of their size, since a mono face looks larger than theirs at one size
    em: 0.9375
  - name: tab_stop
    about: how far apart a tab's stops stand in code, as an editor sets them, not a browser's or a terminal's eight
    cells: 4
    terminal: true
  - name: cross
    about: how big the square of the cross at each corner of the first screen is
    rem: 0.8125
  - name: span_thin
    about: how thick a role's bar is in the phone's career list
    rem: 0.375
  - name: control
    about: how tall a regular control is, two rows
    rem: 3
  - name: content
    about: the widest the page's content runs
    rem: 80
  - name: dialog
    about: the widest a window over the page runs, a dialog's or a hint's
    rem: 35
  - name: pick
    about: the least width of a pick's window, a part's number, a title of a few words and its state on one line
    cells: 48
  - name: gutter
    about: the room either side of the content
    rem: 3
  - name: gutter_phone
    about: the room either side of the content on a phone
    rem: 1
  - name: nudge
    about: an offset inside a row, as far as a tooltip stands from its control
    rem: 0.25
  - name: control_compact
    about: how tall a compact control is, one row, and how wide its square
    rem: 1.5
  - name: box
    about: the square a drawn mark stands in
    rem: 1
  - name: radius
    about: the corner of a button, a chip, a field, a dialog and a tooltip
    rem: 0.125
  - name: hairline
    about: how wide every line is, a border's or a rule's
    rem: 0.0625
  - name: underline_hover
    about: how thick a link's underline is under the pointer, two hairlines, and the line under the letters typed on the command line's menu and under a search's matches
    rem: 0.125

times:
  - name: blink
    about: one blink of the cursor after the name, shown for half of it, as a terminal's cursor blinks
    milliseconds: 1060
  - name: quick
    about: how long a colour takes to change under the pointer
    milliseconds: 120
  - name: toast
    about: how long a toast stays, and a copied command's button says so
    milliseconds: 2400

screen_shares:
  - name: reading_line
    about: the line a post's heading counts as read once its top has passed, so one gone to is read at once
    percent: 33

layers:
  - name: tile
    about: a tile of the blog's list that leads somewhere, over a tile to come beside it, so the line the two share is the live one's
  - name: tile_name
    about: what is set into the top edge of a tile to come, over the line a live tile above it draws there
  - name: tile_focus
    about: the tile the keyboard is on, over its neighbours, so no day or label set into a tile beside it cuts its ring
  - name: foot
    about: the foot line, which the page scrolls under
